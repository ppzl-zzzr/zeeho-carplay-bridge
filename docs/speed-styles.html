<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>车速样式对比</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,600;1,800;1,900&family=Barlow+Semi+Condensed:ital,wght@1,800&family=Exo+2:ital,wght@1,800&family=Orbitron:wght@800&display=swap" rel="stylesheet">
<style>
  :root { --accent: #62d6ec; }
  html, body { margin: 0; background: #03050a; color: #fff; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { padding: 20px 16px 40px; }
  .label { color: #7d8797; font-size: 12px; text-align: center; margin-bottom: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 16px; max-width: 1100px; margin: 0 auto; }
  .card { position: relative; height: 300px; border-radius: 20px; overflow: hidden;
    background: radial-gradient(120% 90% at 80% 100%, #1b2638 0%, #0b111b 55%, #070b12 100%); }
  .card::before { content: ""; position: absolute; inset: 0; opacity: .35;
    background: repeating-linear-gradient(115deg, transparent 0 46px, rgba(120,140,170,.18) 46px 50px),
                repeating-linear-gradient(25deg, transparent 0 70px, rgba(120,140,170,.12) 70px 73px); }
  .card h3 { position: absolute; left: 18px; bottom: 12px; margin: 0; font-size: 13px; font-weight: 500; color: #9aa6b8; }
  .s { position: absolute; left: 30px; top: 34px; }
  .unit { font-family: Barlow, sans-serif; font-weight: 600; letter-spacing: 4px; font-size: 15px; color: rgba(235,242,255,.6); }

  /* A：Barlow 加粗斜体 + 渐变 + 底部反光 */
  .a b { display: block; font-family: Barlow; font-style: italic; font-weight: 900; font-size: 168px; line-height: .86; letter-spacing: -6px;
    background: linear-gradient(180deg, #ffffff 0%, #e8f3ff 45%, #8fb3d9 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 10px 30px rgba(0,0,0,.7)); }
  .a .bar { margin-top: 10px; width: 210px; height: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--accent), rgba(98,214,236,0)); box-shadow: 0 0 14px rgba(98,214,236,.6); }

  /* B：Barlow 斜体 + 青色发光描边层次（运动 TFT 风） */
  .b b { position: relative; display: block; font-family: "Barlow Semi Condensed"; font-style: italic; font-weight: 800; font-size: 178px; line-height: .86; letter-spacing: -4px; color: #fff;
    text-shadow: 0 0 22px rgba(98,214,236,.55), 0 0 2px rgba(255,255,255,.9); }
  .b b::after { content: attr(data-v); position: absolute; left: 10px; top: 8px; z-index: -1; color: transparent; -webkit-text-stroke: 2px rgba(98,214,236,.45); }
  .b .unit { color: var(--accent); }

  /* C：速度弧线 + Barlow 粗体（车机仪表风） */
  .c svg { position: absolute; left: 14px; top: 18px; }
  .c b { position: absolute; left: 0; top: 74px; width: 268px; text-align: center; font-family: Barlow; font-style: italic; font-weight: 800; font-size: 120px; line-height: 1; letter-spacing: -4px;
    text-shadow: 0 8px 26px rgba(0,0,0,.7); }
  .c .unit { position: absolute; left: 0; top: 196px; width: 268px; text-align: center; }

  /* D：Orbitron 科技感 */
  .d b { display: block; font-family: Orbitron; font-weight: 800; font-size: 130px; line-height: .9; letter-spacing: 2px;
    background: linear-gradient(180deg, #fff 20%, #9fe7f5); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 18px rgba(98,214,236,.35)); }
</style>
</head>
<body>
  <div class="label">车速样式对比（真实效果会同步到 App 里，选一个告诉我）</div>
  <div class="grid">
    <div class="card a"><div class="s"><b>49</b><div class="unit">KM/H</div><div class="bar"></div></div><h3>A · Barlow 超粗斜体 + 金属渐变 + 青色光条</h3></div>
    <div class="card b"><div class="s"><b data-v="49">49</b><div class="unit">KM/H</div></div><h3>B · 窄体斜体 + 青色辉光 + 错位描边（运动 TFT 风）</h3></div>
    <div class="card c">
      <svg width="268" height="268" viewBox="0 0 268 268">
        <defs><linearGradient id="arc" x1="0" x2="1"><stop offset="0" stop-color="#62d6ec"/><stop offset="1" stop-color="#9b7bff"/></linearGradient>
          <filter id="gl"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
        <path d="M44 214 A 110 110 0 1 1 224 214" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="10" stroke-linecap="round"/>
        <path d="M44 214 A 110 110 0 0 1 196 46" fill="none" stroke="url(#arc)" stroke-width="10" stroke-linecap="round" filter="url(#gl)"/>
        <g fill="rgba(255,255,255,.35)" font-family="Barlow" font-size="11" font-weight="600"><text x="30" y="236">0</text><text x="226" y="236">120</text></g>
      </svg>
      <b>49</b><div class="unit">KM/H</div><h3>C · 速度弧线 + Barlow 粗斜体（车机仪表风）</h3></div>
    <div class="card d"><div class="s"><b>49</b><div class="unit" style="margin-top:8px">KM/H</div></div><h3>D · Orbitron 未来科技感</h3></div>
  </div>
</body>
</html>
