<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>极核仪表效果图</title>
<style>
  :root { --w: 800px; --h: 384px; --blue: #3d9bff; --green: #34d399; }
  html, body { margin: 0; background: #05070c; color: #fff; font-family: -apple-system, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 28px 16px; }
  .label { color: #8a94a6; font-size: 13px; letter-spacing: .5px; }
  .dash { position: relative; width: var(--w); height: var(--h); overflow: hidden; border-radius: 18px; background: #0a101c; box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.04); }
  .map { position: absolute; inset: 0; }
  .vignette { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(120% 120% at 50% 50%, transparent 45%, rgba(3,6,12,.92) 100%),
                linear-gradient(90deg, rgba(3,6,12,.85) 0%, rgba(3,6,12,.25) 32%, transparent 48%); }

  /* 悬浮车速：无边框，靠柔光与地图融合 */
  .speed { position: absolute; left: 34px; top: 74px; width: 250px; text-align: center; }
  .speed b { display: block; font-size: 148px; line-height: 1; font-weight: 700; letter-spacing: -6px;
    font-variant-numeric: tabular-nums; text-shadow: 0 0 40px rgba(61,155,255,.35), 0 4px 24px rgba(0,0,0,.8); }
  .speed span { font-size: 18px; color: rgba(255,255,255,.6); letter-spacing: 2px; }
  .gear { margin-top: 10px; display: inline-flex; gap: 10px; font-size: 13px; color: rgba(255,255,255,.55); }
  .gear i { font-style: normal; padding: 2px 10px; border-radius: 99px; background: rgba(255,255,255,.06); }
  .gear i.on { color: #fff; background: rgba(61,155,255,.35); }

  /* 通用玻璃卡片：背景模糊 + 边缘羽化 */
  .glass { position: absolute; border-radius: 22px; background: rgba(18,26,42,.38);
    backdrop-filter: blur(22px) saturate(160%); -webkit-backdrop-filter: blur(22px) saturate(160%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 10px 40px rgba(0,0,0,.45);
    -webkit-mask-image: radial-gradient(140% 160% at 50% 50%, #000 62%, transparent 100%);
            mask-image: radial-gradient(140% 160% at 50% 50%, #000 62%, transparent 100%); }

  .nav { left: 300px; top: 18px; width: 230px; height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 16px; box-sizing: border-box; }
  .nav .arrow { width: 40px; height: 40px; border-radius: 12px; background: var(--blue); display: grid; place-items: center; font-size: 24px; font-weight: 800; }
  .nav .d { font-size: 22px; font-weight: 700; } .nav .d small { font-size: 13px; color: rgba(255,255,255,.6); font-weight: 500; }
  .nav .road { font-size: 12px; color: rgba(255,255,255,.65); }

  .clock { position: absolute; right: 26px; top: 16px; text-align: right; }
  .clock b { font-size: 44px; font-weight: 700; letter-spacing: -1px; font-variant-numeric: tabular-nums; text-shadow: 0 2px 16px rgba(0,0,0,.7); }
  .clock div { font-size: 13px; color: rgba(255,255,255,.7); margin-top: -2px; }
  .clock .wx { margin-top: 4px; font-size: 13px; color: rgba(255,255,255,.8); }

  .battery { left: 34px; bottom: 22px; width: 250px; height: 54px; padding: 10px 16px; box-sizing: border-box; }
  .battery .row { display: flex; justify-content: space-between; align-items: baseline; }
  .battery b { font-size: 20px; font-variant-numeric: tabular-nums; } .battery span { font-size: 12px; color: rgba(255,255,255,.65); }
  .bar { margin-top: 6px; height: 5px; border-radius: 9px; background: rgba(255,255,255,.12); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 68%; border-radius: 9px; background: linear-gradient(90deg, #22c55e, var(--green)); }

  /* 媒体卡片：专辑封面模糊做底色 */
  .media { right: 22px; bottom: 20px; width: 300px; height: 112px; padding: 14px; box-sizing: border-box; display: flex; gap: 14px; overflow: hidden; }
  .media::before { content: ""; position: absolute; inset: -30px; z-index: -1;
    background: radial-gradient(circle at 25% 40%, #ff5d8f 0, transparent 55%), radial-gradient(circle at 80% 70%, #7c5cff 0, transparent 60%);
    filter: blur(28px); opacity: .55; }
  .cover { width: 84px; height: 84px; border-radius: 14px; flex: none;
    background: linear-gradient(135deg, #ff7aa2, #8b5cf6 60%, #3b82f6); box-shadow: 0 8px 24px rgba(0,0,0,.45); }
  .meta { min-width: 0; flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .src { font-size: 11px; color: rgba(255,255,255,.6); display: flex; align-items: center; gap: 6px; }
  .src i { width: 7px; height: 7px; border-radius: 50%; background: #ef4444; }
  .title { font-size: 17px; font-weight: 700; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .artist { font-size: 12px; color: rgba(255,255,255,.7); margin-top: 2px; }
  .prog { margin-top: 10px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.18); }
  .prog i { display: block; width: 42%; height: 100%; border-radius: 3px; background: #fff; }
</style>
</head>
<body>
  <div class="label">极核仪表 · 800×384 横屏效果图（实际按仪表上报的分辨率自适应）</div>
  <div class="dash">
    <svg class="map" viewBox="0 0 800 384" preserveAspectRatio="none">
      <defs>
        <pattern id="blk" width="64" height="64" patternUnits="userSpaceOnUse" patternTransform="rotate(-18)">
          <rect width="64" height="64" fill="#0d1524"/><rect x="6" y="6" width="52" height="52" rx="6" fill="#111b2d"/>
        </pattern>
        <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      <rect width="800" height="384" fill="url(#blk)"/>
      <path d="M-20 300 C 200 250, 420 330, 820 240" stroke="#1f2b40" stroke-width="22" fill="none"/>
      <path d="M120 -20 C 160 120, 90 260, 160 420" stroke="#1a2436" stroke-width="16" fill="none"/>
      <path d="M520 -20 C 600 140, 470 250, 700 420" stroke="#1f2b40" stroke-width="20" fill="none"/>
      <path d="M-20 90 L 820 150" stroke="#172133" stroke-width="12" fill="none"/>
      <path d="M560 420 C 540 300, 600 230, 560 150 S 610 40, 700 -10" stroke="#3d9bff" stroke-width="9" fill="none" stroke-linecap="round" filter="url(#glow)" opacity=".95"/>
      <circle cx="562" cy="330" r="12" fill="#3d9bff" opacity=".25"/><circle cx="562" cy="330" r="7" fill="#fff"/><circle cx="562" cy="330" r="4.5" fill="#3d9bff"/>
    </svg>
    <div class="vignette"></div>

    <div class="speed"><b>46</b><span>KM/H</span>
      <div class="gear"><i>ECO</i><i class="on">STREET</i><i>SPORT</i></div></div>

    <div class="glass nav"><div class="arrow">↱</div>
      <div><div class="d">300<small> 米</small></div><div class="road">右转进入 滨江大道</div></div></div>

    <div class="clock"><b>18:42</b><div>11月10日 周一</div><div class="wx">☁ 17° 多云</div></div>

    <div class="glass battery"><div class="row"><b>68%</b><span>续航 30 km</span></div><div class="bar"><i></i></div></div>

    <div class="glass media"><div class="cover"></div>
      <div class="meta"><div class="src"><i></i>网易云音乐</div><div class="title">至少相拥没错</div>
        <div class="artist">MC 张天赋</div><div class="prog"><i></i></div></div></div>
  </div>
  <div class="label">地图为示意；正式版用高德地图暗色样式铺底，速度/卡片悬浮其上，卡片背景模糊、边缘羽化融入地图</div>
</body>
</html>
