<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>极核仪表字体方案</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;500;600;700&family=Saira+Semi+Condensed:wght@300;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --accent: #62d6ec; --t2: rgba(235,242,255,.62); }
  html, body { margin: 0; background: #03050a; color: #fff; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 22px 16px 40px; }
  h2 { margin: 22px 0 4px; font-size: 16px; font-weight: 600; color: #cfd8e6; }
  .label { color: #7d8797; font-size: 12px; }
  .dash { position: relative; width: 1024px; height: 480px; overflow: hidden; border-radius: 24px; background: #070b12; }
  .f-a { --num: "Barlow"; } .f-b { --num: "Saira Semi Condensed"; } .f-c { --num: "Rajdhani"; }
  .num { font-family: var(--num), "PingFang SC", sans-serif; }

  .world { position: absolute; inset: 0; perspective: 700px; perspective-origin: 45% 0%; }
  .plane { position: absolute; left: 50%; top: 50%; width: 1536px; height: 1280px; margin: -560px 0 0 -820px;
    transform: rotateX(58deg) rotateZ(-14deg); transform-origin: 50% 60%; }
  .tiles { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(6, 256px);
    filter: invert(1) hue-rotate(185deg) brightness(.62) contrast(1.25) saturate(.55); }
  .tiles img { width: 256px; height: 256px; display: block; }
  .plane svg { position: absolute; inset: 0; }
  .fog { position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, #070b12 0%, rgba(7,11,18,.9) 13%, rgba(7,11,18,.2) 40%, transparent 58%),
                radial-gradient(90% 80% at 45% 85%, transparent 35%, rgba(4,7,12,.75) 100%),
                linear-gradient(90deg, rgba(5,8,14,.9) 0%, rgba(5,8,14,.5) 24%, transparent 40%); }
  .puck { position: absolute; left: 430px; top: 350px; width: 50px; height: 50px; margin: -25px 0 0 -25px; }
  .puck::before { content: ""; position: absolute; inset: -40px; border-radius: 50%; background: radial-gradient(circle, rgba(98,214,236,.35), transparent 65%); }
  .puck svg { position: relative; filter: drop-shadow(0 8px 14px rgba(0,0,0,.7)); }

  .top { position: absolute; left: 40px; right: 40px; top: 24px; display: flex; align-items: center; font-size: 14px; }
  .brand { font-weight: 900; font-style: italic; letter-spacing: 3px; font-size: 20px; font-family: var(--num), sans-serif; }
  .model { margin-left: 12px; padding-left: 12px; border-left: 1px solid rgba(255,255,255,.22); letter-spacing: 3px; color: var(--t2); font-size: 12px; font-family: var(--num), sans-serif; font-weight: 600; }
  .clock { position: absolute; left: 50%; transform: translateX(-50%); font-size: 24px; font-weight: 600; }
  .clock span { font-size: 13px; color: var(--t2); margin-left: 10px; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; font-weight: 400; }
  .stat { margin-left: auto; display: flex; gap: 14px; align-items: center; color: var(--t2); font-size: 15px; }
  .stat b { color: #fff; font-weight: 600; }
  .bat { width: 26px; height: 12px; border-radius: 3px; border: 1.5px solid rgba(255,255,255,.7); position: relative; }
  .bat::after { content: ""; position: absolute; left: 1.5px; top: 1.5px; bottom: 1.5px; width: 65%; border-radius: 1.5px; background: #3ee08f; }

  .speed { position: absolute; left: 40px; top: 92px; }
  .speed b { display: block; font-size: 168px; line-height: .9; font-weight: 600; letter-spacing: -4px;
    text-shadow: 0 10px 34px rgba(0,0,0,.7); }
  .f-c .speed b { font-size: 186px; letter-spacing: -2px; }
  .speed .u { margin-top: 4px; font-size: 17px; letter-spacing: 4px; color: var(--t2); font-weight: 500; }
  .speed .g { margin-top: 14px; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--accent); font-weight: 600; letter-spacing: 1px; }
  .speed .g::before { content: ""; width: 26px; height: 3px; border-radius: 3px; background: var(--accent); }
  .trip { position: absolute; left: 40px; bottom: 30px; display: flex; gap: 22px; font-size: 13px; color: var(--t2); }
  .trip b { color: #fff; font-size: 17px; font-weight: 600; margin-left: 6px; }

  /* 大号媒体卡：背景模糊 + 四边羽化 + 封面取色 + 歌词滚动 */
  .media { position: absolute; left: 536px; top: 78px; width: 452px; height: 372px; border-radius: 30px; overflow: hidden;
    -webkit-mask-image: radial-gradient(120% 115% at 50% 50%, #000 58%, transparent 100%);
            mask-image: radial-gradient(120% 115% at 50% 50%, #000 58%, transparent 100%); }
  .media .bg { position: absolute; inset: 0; backdrop-filter: blur(30px) saturate(150%); -webkit-backdrop-filter: blur(30px) saturate(150%);
    background: linear-gradient(160deg, rgba(120,60,110,.40), rgba(20,26,44,.55) 55%, rgba(12,16,28,.65)); }
  .media .tint { position: absolute; inset: -60px; filter: blur(50px); opacity: .55;
    background: radial-gradient(circle at 18% 18%, #ff6f9c, transparent 45%), radial-gradient(circle at 85% 35%, #6c5cff, transparent 50%); }
  .media .in { position: relative; height: 100%; padding: 30px 34px; box-sizing: border-box; display: flex; flex-direction: column; }
  .head { display: flex; gap: 18px; align-items: center; }
  .cover { width: 92px; height: 92px; border-radius: 16px; flex: none; background: linear-gradient(140deg, #ff8fb1, #7b5cff 55%, #2f7cf6);
    box-shadow: 0 12px 30px rgba(0,0,0,.45); }
  .src { font-size: 12px; color: var(--t2); display: flex; align-items: center; gap: 6px; } .src i { width: 7px; height: 7px; border-radius: 50%; background: #ef4444; }
  .title { font-size: 26px; font-weight: 700; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .artist { font-size: 14px; color: var(--t2); margin-top: 3px; }
  .lyrics { flex: 1; margin-top: 18px; display: flex; flex-direction: column; justify-content: center; gap: 9px;
    -webkit-mask-image: linear-gradient(180deg, transparent, #000 28%, #000 72%, transparent);
            mask-image: linear-gradient(180deg, transparent, #000 28%, #000 72%, transparent); }
  .lyrics div { font-size: 16px; color: rgba(255,255,255,.4); transition: all .4s; }
  .lyrics .now { font-size: 23px; font-weight: 700; color: #fff; text-shadow: 0 0 18px rgba(255,255,255,.25); }
  .prog { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--t2); }
  .prog .bar { flex: 1; height: 4px; border-radius: 4px; background: rgba(255,255,255,.16); }
  .prog .bar i { display: block; height: 100%; width: 38%; border-radius: 4px; background: #fff; }
</style>
</head>
<body>
  <div class="label">三套字体方案（数字/英文用开源字体打包进 App，中文用苹方）· 2048×960 比例 · 选一套告诉我</div>
  <div id="list"></div>
<script>
  var variants = [
    ['f-a', '方案 A · Barlow（DIN 风格，干净利落，很多车机在用）'],
    ['f-b', '方案 B · Saira Semi Condensed（科技感，略窄，偏 HUD）'],
    ['f-c', '方案 C · Rajdhani（运动感，窄体方角，数字更大更醒目）']
  ];
  var tiles = '';
  for (var y = 0; y < 5; y++) for (var x = 0; x < 6; x++)
    tiles += '<img src="https://webrd0' + (1 + (x + y) % 4) + '.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x=' + (54640 + x) + '&y=' + (26983 + y) + '&z=16">';
  var dash = function (cls) { return '' +
    '<div class="dash ' + cls + '">' +
    '<div class="world"><div class="plane"><div class="tiles">' + tiles + '</div>' +
    '<svg viewBox="0 0 1536 1280"><defs><filter id="g' + cls + '"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>' +
    '<path d="M760 1300 L 760 900 C 760 820, 790 760, 860 720 L 1060 600 C 1120 565, 1150 520, 1150 450 L 1150 80" stroke="#62d6ec" stroke-width="16" fill="none" stroke-linecap="round" filter="url(#g' + cls + ')" opacity=".9"/></svg>' +
    '</div></div><div class="fog"></div>' +
    '<div class="puck"><svg width="50" height="50" viewBox="0 0 54 54"><circle cx="27" cy="27" r="25" fill="rgba(8,14,22,.85)" stroke="#62d6ec" stroke-width="2"/><path d="M27 11 L39 39 L27 33 L15 39 Z" fill="#fff"/></svg></div>' +
    '<div class="top"><span class="brand">ZEEHO</span><span class="model">AE6 ULTRA</span>' +
    '<div class="clock num">18:42<span>11/10 周二</span></div>' +
    '<div class="stat num"><span>☁ 17°</span><span class="bat"></span><b>68%</b><span>30 km</span></div></div>' +
    '<div class="speed"><b class="num">49</b><div class="u num">KM/H</div><div class="g num">GPS</div></div>' +
    '<div class="trip">行程<b class="num">12.6 km</b>时长<b class="num">00:31</b>最高<b class="num">69</b></div>' +
    '<div class="media"><div class="bg"></div><div class="tint"></div><div class="in">' +
    '<div class="head"><div class="cover"></div><div style="min-width:0"><div class="src"><i></i>酷狗音乐</div>' +
    '<div class="title">至少相拥没错</div><div class="artist">MC 张天赋</div></div></div>' +
    '<div class="lyrics"><div>一路走过的风景都已经模糊</div><div>你说的未来我还记得清楚</div><div class="now">至少相拥没错 至少曾经炙热</div><div>就算结局不是我想的那样</div><div>也感谢你陪我走这一程</div></div>' +
    '<div class="prog num"><span>1:12</span><div class="bar"><i></i></div><span>3:08</span></div></div></div>' +
    '</div>'; };
  var html = '';
  variants.forEach(function (v) { html += '<h2>' + v[1] + '</h2>' + dash(v[0]); });
  document.getElementById('list').innerHTML = html;
  function fit() { document.querySelectorAll('.dash').forEach(function (d) { d.style.zoom = Math.min(1, (innerWidth - 32) / 1024); }); }
  fit(); addEventListener('resize', fit);
</script>
</body>
</html>
