<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>极核仪表效果图</title>
<style>
  /* 设计基准：仪表 2048×960，这里按 1/2 = 1024×480 预览 */
  :root { --accent: #5fd3e8; --text2: rgba(255,255,255,.62); --pill: rgba(255,255,255,.07); }
  html, body { margin: 0; background: #04060a; color: #fff;
    font-family: -apple-system, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 24px 16px; }
  .label { color: #7d8797; font-size: 12px; }
  .dash { position: relative; width: 1024px; height: 480px; overflow: hidden; border-radius: 22px; background: #0b1119;
    box-shadow: 0 30px 80px rgba(0,0,0,.6); }
  svg.map { position: absolute; inset: 0; }
  .shade { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(110% 120% at 62% 60%, transparent 40%, rgba(5,8,13,.9) 100%),
                linear-gradient(90deg, rgba(6,9,14,.88) 0%, rgba(6,9,14,.35) 30%, transparent 46%),
                linear-gradient(180deg, rgba(6,9,14,.75) 0%, transparent 22%, transparent 78%, rgba(6,9,14,.8) 100%); }

  .top { position: absolute; left: 44px; right: 44px; top: 30px; display: flex; align-items: center; }
  .brand { font-weight: 900; font-style: italic; letter-spacing: 3px; font-size: 22px; }
  .model { margin-left: 14px; padding-left: 14px; border-left: 1px solid rgba(255,255,255,.25); font-size: 13px; letter-spacing: 3px; color: var(--text2); }
  .clock { position: absolute; left: 50%; transform: translateX(-50%); display: flex; align-items: baseline; gap: 12px; }
  .clock b { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .clock span { font-size: 15px; color: var(--text2); }
  .status { margin-left: auto; display: flex; gap: 14px; align-items: center; font-size: 14px; color: var(--text2); }
  .status .soc { color: #fff; font-weight: 600; } .status .soc i { color: #34d399; font-style: normal; }
  .status .net { color: var(--accent); }

  .speed { position: absolute; left: 44px; top: 128px; }
  .speed .n { display: flex; align-items: flex-end; gap: 10px; }
  .speed b { font-size: 156px; line-height: .86; font-weight: 800; letter-spacing: -6px; font-variant-numeric: tabular-nums;
    text-shadow: 0 6px 30px rgba(0,0,0,.6); }
  .speed u { text-decoration: none; font-size: 30px; color: rgba(255,255,255,.75); margin-bottom: 6px; }
  .speed .tag { margin-top: 18px; display: flex; align-items: center; gap: 10px; font-size: 15px; color: rgba(255,255,255,.75); }
  .speed .tag::before { content: ""; width: 34px; height: 3px; border-radius: 3px; background: var(--accent); }

  .trip { position: absolute; left: 44px; bottom: 40px; display: flex; gap: 26px; font-size: 16px; color: var(--text2); }
  .trip b { color: #fff; font-weight: 600; margin-left: 6px; font-variant-numeric: tabular-nums; }

  /* 悬浮媒体：无卡片框，靠地图暗区承托 */
  .media { position: absolute; left: 600px; top: 150px; width: 380px; }
  .media .hd { font-size: 14px; color: rgba(255,255,255,.8); display: flex; gap: 8px; align-items: center; }
  .media .hd i { color: var(--accent); font-style: normal; letter-spacing: -1px; }
  .media .row { margin-top: 18px; display: flex; gap: 18px; align-items: center; }
  .cover { width: 92px; height: 92px; border-radius: 16px; flex: none; position: relative; overflow: hidden;
    background: linear-gradient(135deg, #2a3f52, #19323e); box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  .cover::after { content: "♪"; position: absolute; inset: 0; display: grid; place-items: center; font-size: 40px; color: var(--accent); }
  .media .t { font-size: 30px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .media .a { font-size: 16px; color: var(--text2); margin-top: 6px; }
  .media .prog { margin-top: 18px; display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--text2); font-variant-numeric: tabular-nums; }
  .media .bar { flex: 1; height: 3px; border-radius: 3px; background: rgba(255,255,255,.16); }
  .media .bar i { display: block; height: 100%; width: 38%; border-radius: 3px; background: var(--accent); }

  .next { position: absolute; right: 44px; bottom: 34px; display: flex; align-items: center; gap: 12px;
    padding: 10px 18px; border-radius: 99px; background: var(--pill); backdrop-filter: blur(14px); font-size: 15px; }
  .next .arr { color: var(--accent); font-size: 20px; font-weight: 800; }
  .next b { font-size: 18px; }
</style>
</head>
<body>
  <div class="label">极核仪表 · 2048×960 比例预览（按你上一版风格）</div>
  <div class="dash">
    <svg class="map" viewBox="0 0 1024 480" preserveAspectRatio="none">
      <rect width="1024" height="480" fill="#0c131c"/>
      <g stroke="#1c2836" stroke-width="7" fill="none" stroke-linecap="round">
        <path d="M-20 120 L 1040 70"/><path d="M-20 250 L 1040 205"/><path d="M-20 400 L 1040 330"/>
        <path d="M180 -20 L 120 500"/><path d="M330 -20 L 290 500"/><path d="M480 -20 L 430 500"/>
        <path d="M640 -20 L 600 500"/><path d="M800 -20 L 760 500"/><path d="M950 -20 L 900 500"/>
      </g>
      <g stroke="#26364a" stroke-width="13" fill="none" stroke-linecap="round" opacity=".9">
        <path d="M-20 360 C 220 300, 480 290, 700 250 S 950 170, 1040 150"/>
        <path d="M560 500 C 600 420, 650 380, 700 250"/>
      </g>
      <path d="M690 500 C 690 440, 670 400, 690 345 S 760 250, 820 230" stroke="#5fd3e8" stroke-width="6" fill="none"
            stroke-linecap="round" opacity=".55"/>
      <g fill="rgba(255,255,255,.4)" font-size="20" font-family="PingFang SC, Microsoft YaHei, sans-serif">
        <text x="545" y="112">云水路</text><text x="450" y="415">环湖东路</text><text x="860" y="405" fill="rgba(95,211,232,.35)">湖畔公园</text>
      </g>
      <circle cx="690" cy="345" r="30" fill="rgba(10,16,24,.9)" stroke="#5fd3e8" stroke-width="2.5" opacity=".95"/>
      <path d="M690 328 L 703 357 L 690 350 L 677 357 Z" fill="#fff"/>
    </svg>
    <div class="shade"></div>

    <div class="top">
      <span class="brand">ZEEHO</span><span class="model">AE6&nbsp;ULTRA</span>
      <div class="clock"><b>00:48</b><span>11/10 星期二</span></div>
      <div class="status"><span class="soc"><i>▮</i> 68% · 30 km</span><span>☁ 17°</span><span class="net">● 投屏中</span></div>
    </div>

    <div class="speed"><div class="n"><b>49</b><u>km/h</u></div><div class="tag">GPS 车速</div></div>

    <div class="media">
      <div class="hd"><i>ıllı</i>媒体 · 网易云音乐</div>
      <div class="row"><div class="cover"></div>
        <div style="min-width:0"><div class="t">至少相拥没错</div><div class="a">MC 张天赋</div></div></div>
      <div class="prog"><span>1:12</span><div class="bar"><i></i></div><span>3:08</span></div>
    </div>

    <div class="trip"><span>行程<b>0.69 km</b></span><span>时长<b>00:51</b></span><span>均速<b>49 km/h</b></span><span>最高<b>69 km/h</b></span></div>

    <div class="next"><span class="arr">↱</span><b>300 米</b><span style="color:var(--text2)">右转进入 云水路</span></div>
  </div>
  <div class="label">投到仪表的画面只放信息，不放按钮；导航、音乐、设置等按钮留在手机 App 里操作</div>
<script>
  function fit() { document.querySelector('.dash').style.zoom = Math.min(1, (innerWidth - 32) / 1024); }
  fit(); addEventListener('resize', fit);
</script>
</body>
</html>
