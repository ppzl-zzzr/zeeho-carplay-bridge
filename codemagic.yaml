workflows:
  ios-release:
    name: 两个成品 IPA（编译 + 签名）
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: latest
      cocoapods: default
      groups:
        - amap
        - signing
    scripts:
      - name: 生成工程 + 安装高德 SDK
        script: |
          brew install xcodegen
          cd ios && xcodegen generate && pod install --repo-update
      - name: 编译仪表版和面板版
        script: |
          cd ios
          set -o pipefail
          for T in ZeehoBridge ZeehoPanel; do
            xcodebuild -workspace ZeehoBridge.xcworkspace -scheme $T               -configuration Release -sdk iphoneos -destination 'generic/platform=iOS'               -derivedDataPath build               CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""               AMAP_IOS_KEY="$AMAP_IOS_KEY"               build 2>&1 | tee build-$T.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)"
          done
      - name: 签名并打包
        script: |
          cd ios
          set -e
          KC=build.keychain; KP=ci-$RANDOM
          security create-keychain -p "$KP" $KC
          security list-keychains -d user -s $KC $(security list-keychains -d user | sed 's/"//g')
          security unlock-keychain -p "$KP" $KC
          security set-keychain-settings -t 3600 $KC
          echo "$SIGN_P12_B64" | base64 --decode > cert.p12
          security import cert.p12 -k $KC -P "$SIGN_P12_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KP" $KC >/dev/null
          ID=$(security find-identity -v -p codesigning $KC | head -1 | awk '{print $2}')
          echo "signing identity: $ID"
          echo "$PROFILE_DASH_B64" | base64 --decode > dash.mobileprovision
          echo "$PROFILE_WILD_B64" | base64 --decode > wild.mobileprovision
          sign() {
            APP=$1; PROF=$2; BUNDLE=$3; OUT=$4
            cp "$PROF" "$APP/embedded.mobileprovision"
            security cms -D -i "$PROF" > prof.plist
            /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' prof.plist > ent.plist
            /usr/libexec/PlistBuddy -c "Set :application-identifier 79ECZZR225.$BUNDLE" ent.plist
            find "$APP" -name "*.framework" -o -name "*.dylib" | while read F; do codesign -f -s "$ID" "$F"; done
            codesign -f -s "$ID" --entitlements ent.plist "$APP"
            codesign -v "$APP" && echo "verified $APP"
            rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/ && zip -qry "$OUT" Payload
          }
          P=build/Build/Products/Release-iphoneos
          for T in ZeehoBridge ZeehoPanel; do
            rm -rf Payload && mkdir Payload && cp -R $P/$T.app Payload/ && zip -qry $T-unsigned.ipa Payload
          done
          sign $P/ZeehoBridge.app dash.mobileprovision com.zeeho.bridge ZeehoBridge-signed.ipa
          sign $P/ZeehoPanel.app wild.mobileprovision com.zeeho.panel ZeehoPanel-signed.ipa
          rm -f cert.p12
          security delete-keychain $KC
    artifacts:
      - ios/ZeehoBridge-signed.ipa
      - ios/ZeehoPanel-signed.ipa
      - ios/ZeehoBridge-unsigned.ipa
      - ios/ZeehoPanel-unsigned.ipa
      - ios/build-*.log

  ios-screenshot:
    name: 模拟器截图（演示数据）
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: 生成 Xcode 工程
        script: brew install xcodegen && cd ios && xcodegen generate
      - name: 编译模拟器版
        script: |
          cd ios
          set -o pipefail
          xcodebuild -project ZeehoBridge.xcodeproj -target ZeehoBridge -configuration Debug -sdk iphonesimulator \
            SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO build 2>&1 | tee sim.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)"
      - name: 运行并导出仪表截图
        script: |
          cd ios
          UDID=$(xcrun simctl list devices available -j | python3 -c "import sys,json; d=json.load(sys.stdin)['devices']; print([x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')][-1])")
          echo "simulator $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Debug-iphonesimulator/ZeehoBridge.app
          xcrun simctl privacy "$UDID" grant location-always com.zeeho.bridge || true
          xcrun simctl privacy "$UDID" grant media-library com.zeeho.bridge || true
          xcrun simctl location "$UDID" set 30.2590,120.1650 || true
          xcrun simctl spawn "$UDID" defaults write -g AppleLanguages -array zh-Hans || true
          xcrun simctl spawn "$UDID" defaults write -g AppleLocale zh_CN || true
          xcrun simctl launch "$UDID" com.zeeho.bridge -demo -AppleLanguages "(zh-Hans)" -AppleLocale zh_CN
          C=""
          for i in $(seq 1 40); do
            C=$(xcrun simctl get_app_container "$UDID" com.zeeho.bridge data)
            [ -f "$C/Documents/export-done.txt" ] && break
            sleep 3
          done
          mkdir -p shots
          cp "$C"/Documents/dash-*.png shots/ || true
          xcrun simctl io "$UDID" screenshot shots/phone.png || true
          cat "$C/Documents/export-done.txt" || true
          ls -la shots
    artifacts:
      - ios/shots/*.png
      - ios/sim.log
